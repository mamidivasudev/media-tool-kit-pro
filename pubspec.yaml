name: video_toolkit_pro
description: A production-ready Flutter app for offline video and audio processing using FFmpeg.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # File picking
  file_picker: ^8.1.2

  # Video playback
  video_player: ^2.9.1

  # Path management
  path_provider: ^2.1.4
  path: ^1.9.0

  # Save to gallery
  gal: ^2.3.0

  # Sharing files
  share_plus: ^10.0.0

  # State management
  provider: ^6.1.2

  # Persisting preferences
  shared_preferences: ^2.3.3

  # UI utilities
  cupertino_icons: ^1.0.8
  ffmpeg_kit_flutter_new: ^4.2.1
  pdf: ^3.12.0
  crop_your_image: ^2.0.1
  google_mlkit_text_recognition: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
dependency_overrides:
  archive: 4.7.1
